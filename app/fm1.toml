# DREAM's build settings (fm1-base tools/build.py)
name = "DREAM"                 # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_49"          # package identity: dev FM-1_4900, releases FM-1_49XXYYZZ
usb_manufacturer = "DREAM"
usb_product = "DREAM FM-1"
ble = false                    # no radio
include = ["dsp"]
o2 = ["dsp/drone.c"]           # the engine, at -O2
words = "words.tsv"
# the site
tagline = "Sine tones in just intonation, held. After La Monte Young and Marian Zazeela."
repo = "https://github.com/sethgraves/fm1-dream"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json
author = "Seth Graves"
description = "A tribute to La Monte Young: pure sine tones tuned in whole-number ratios and held, phase-locked, with no effects or samples. Pieces after Composition 1960 No. 7, the Dream House with its eight bases, the Well-Tuned Piano's Opening and Magic Chords and its tuning, a drift study and Map of 49's Dream (the last two in tones chosen by his stated rules). These pieces were made to sound for hours or days; the few recordings released are long out of print, and you can't buy them new. DREAM keeps a version of that sound going for as long as it was meant to last."
tags = ["synth", "ambient", "generative", "experimental"]
install = "https://thefirmwarehub.com/"
site = "https://sethgraves.github.io/fm1-dream/"
screenshot = "app/docs/img/screen-playing.png"
