# DREAM's build settings (fm1-base tools/build.py)
name = "DREAM"                 # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_49"          # package identity: dev FM-1_4900, releases FM-1_49XXYYZZ
usb_manufacturer = "DREAM"
usb_product = "DREAM FM-1"
ble = false                    # no radio
include = ["dsp"]
o2 = ["dsp/drone.c"]           # the engine, at -O2
words = "words.tsv"
# the site
tagline = "Sine tones in just intonation, held. After La Monte Young."
repo = "https://github.com/sethgraves/fm1-amb"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json
author = "Seth Graves"
description = "Pure sine tones tuned in whole-number ratios and held, phase-locked, for as long as the FM-1 is on. After La Monte Young's Dream House and Composition 1960 #7."
tags = ["synth"]
install = "https://github.com/sethgraves/fm1-amb"
site = "https://github.com/sethgraves/fm1-amb"
screenshot = "docs/img/screen-playing.png"
