# DREAM: the device firmware, built on GitHub by the shared FM-1 builder (zvenson/fm1-build). Run it from
# Actions ("Run workflow"), or push to a dream/* branch. The package is in the run's "packages" artifact.
name: DREAM firmware

on:
  workflow_dispatch:
  push:
    branches: ['main', 'dream/**']

permissions:
  contents: read

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        python3 base/tools/build.py app
        mkdir -p build/out
        cp app/build/dream.fwsc build/out/
        cp app/build/firmware.json build/out/ 2>/dev/null || true
      test: |
        set -euo pipefail
        python3 base/tools/build.py app --host
        mkdir -p build/host-run
        app/build/host/dream_host app/tests/basic.txt build/host-run
      packages: build/out/*

  # the browser emulator (fm1-base tools/build.py --web), published on GitHub Pages
  emulator:
    if: github.ref == 'refs/heads/main'      # the site is main's; a branch builds only the firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the emulator
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          sudo apt-get install -y -qq libfribidi0
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          python3 base/tools/build.py app --web
          ls -la app/build/emu
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/emu

  pages:
    needs: emulator
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
