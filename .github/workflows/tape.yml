# TAPE: the device firmware, built on GitHub by the shared FM-1 builder (zvenson/fm1-build). Run it from
# Actions ("Run workflow"), or push to a tape/* branch. The package is in the run's "packages" artifact; the
# build's log ("image ... SRAM ... free") says how much RAM the loop leaves.
name: TAPE firmware

on:
  workflow_dispatch:
  push:
    branches: ['tape/**']

permissions:
  contents: read

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        python3 base/tools/build.py tape
        mkdir -p build/out
        cp tape/build/tape.fwsc build/out/
        cp tape/build/firmware.json build/out/ 2>/dev/null || true
      test: |
        set -euo pipefail
        python3 base/tools/build.py tape --host
        mkdir -p build/host-run
        tape/build/host/tape_host tape/tests/basic.txt build/host-run
      packages: build/out/*

  # the browser emulator (fm1-base tools/build.py --web), pushed to the tape-emu branch for previews
  emulator:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the emulator
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          sudo apt-get install -y -qq libfribidi0
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          python3 base/tools/build.py tape --web
          ls -la tape/build/emu
      - name: Push it to tape-emu
        run: |
          set -euo pipefail
          cd tape/build/emu
          git init -q -b tape-emu
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "emulator from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tape-emu
