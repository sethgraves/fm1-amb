# SPDX-License-Identifier: MPL-2.0
# DREAM's release: built from source on GitHub by the shared FM-1 builder, its packages signed with build
# provenance. After AMB-1's (charlesvestal/fm1-amb), from fm1-base's template. Push a tag vX.Y: a draft release is
# made, the builder builds and signs the packages into it, they are verified against this commit, and the release
# is published.
name: DREAM release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: dream-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # (the versions base/tools/build.py --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "DREAM $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        version=${GITHUB_REF_NAME#v}
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/)
        git submodule update --init --recursive
        # the fonts' OpenType features (base/tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        python3 base/tools/build.py app --release "$version"
        mkdir -p build/release-assets
        cp "app/build/dream-$version.fwsc" build/release-assets/
        # the firmware described for hubs (base/docs/FIRMWARE-JSON.md)
        cp app/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        python3 base/tools/build.py app --host
        mkdir -p build/host-run
        app/build/host/dream_host app/tests/basic.txt build/host-run
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/firmware.json; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
