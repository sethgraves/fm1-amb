# TAPE's build settings (fm1-base tools/build.py)
name = "TAPE"                  # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_48"          # package identity: dev FM-1_4800, releases FM-1_48XXYYZZ
usb_manufacturer = "TAPE"
usb_product = "TAPE FM-1"
ble = false                    # no radio
ram_layout = "packed"          # one SRAM budget: the build reports exactly what the loop leaves free
include = ["dsp"]
o2 = ["dsp/tape.c"]           # the engine, at -O2
words = "words.tsv"
# the site
tagline = "A generative ambient machine that only exists on tape."
repo = "https://github.com/sethgraves/fm1-dream"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json
author = "Seth Graves"
description = "Warm pads, soft bells, a breathy flute and a stream, played through a tape that is part of the instrument: wow, flutter, saturation, hiss, dull highs, dropouts, motor drag, head misalignment and print-through. Four tape types, one AGE knob, and a tape that wears as you play it and remembers."
tags = ["ambient", "generative"]
install = "https://github.com/sethgraves/fm1-dream"
site = "https://github.com/sethgraves/fm1-dream"
screenshot = "docs/img/screen-playing.png"
